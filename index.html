<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Práctica JS</title>
    </head>

    <body>
        <!-- Parte 1 -->

        <h1>Ejercicio 1</h1>

        <h1 id="titulo">Hola</h1>

        <p>Este es un párrafo cualquiera.</p>

        <button id="cambiar">Cambiar</button>
        <button id="resetear">Resetear</button>

        <hr>

        <!-- Parte 2 -->

        <div id="caja">
            Este div cambia de color
        </div>

        <button id="activar">Activar</button>

        <hr>

        <!-- Parte 3 -->

        <input type="text" id="nombre" placeholder="Escribí tu nombre">

        <p id="saludo"></p>

        <hr>

        <!-- Parte 4 -->

        <div id="contador">0</div>

        <button id="sumar">+</button>
        <button id="restar">-</button>

        <hr>

        <h1>Ejercicio 2</h1>
        
        <h2>Parte 1 - Validación de campo</h2>
        <input type="text" id="campo" placeholder="texto">
        
        <button id="verificar">verificar</button>
        <p id="resultado"></p>

        <hr>

        <h2>Parte 2 - Arrays y for</h2>

        <button id="mostrar">Mostrar lista</button>
        <ul id="lista"></ul>

        <button id="mostrarTres">Sólo los primeros tres</button>
        <ul id="listaTres"></ul>

        <hr>

        <h2>Parte 3 - Funciones con return</h2>

        <input type="number" id="numero1" placeholder="Número 1">
        <input type="number" id="numero2" placeholder="Número 2">

        <button id="sumarNumeros">Sumar</button>

        <p id="resultadoSuma"></p>
            
        <hr>

        <h2>Extra - while</h2>

        <button id="botonContar">Contar hasta 10</button>

        <p id="cuenta"></p>

        <script src="app.js"></script>
        </body>
</html>
